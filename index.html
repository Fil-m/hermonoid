<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Hermonoid</title>
<style>
/* ─── CSS Root ─────────────────────────────────────────── */
:root {
  --bg: #1a1a2e;
  --bg2: #222244;
  --bg3: #2d2d44;
  --accent: #7c3aed;
  --accent2: #6d28d9;
  --text: #e0e0e0;
  --text2: #888;
  --user-bubble: #7c3aed;
  --assistant-bubble: #2d2d44;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
  background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  overscroll-behavior:none;
}
input,textarea,select,button{font-family:inherit}
/* ─── Scrollbar ─────────────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text2);border-radius:4px}
/* ─── Top Bar ───────────────────────────────────────────── */
.top-bar{
  display:flex;align-items:center;padding:8px 12px;
  background:var(--bg2);border-bottom:1px solid #333;
  gap:8px;flex-shrink:0;z-index:10;
}
.top-bar .title{font-size:20px;font-weight:bold;color:var(--accent);flex:1}
.top-bar .btn{
  background:none;border:none;color:var(--text2);font-size:22px;
  cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm);
  transition:all 0.2s;
}
.top-bar .btn:hover,.top-bar .btn.active{background:var(--bg3);color:var(--accent)}
/* ─── Chat ──────────────────────────────────────────────── */
.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-area.hidden{display:none}
.message{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.message.user{
  align-self:flex-end;background:var(--user-bubble);color:#fff;
  border-bottom-right-radius:6px;
}
.message.assistant{
  align-self:flex-start;background:var(--assistant-bubble);color:var(--text);
  border-bottom-left-radius:6px;
}
.message.image{background:transparent;padding:0;max-width:300px}
.message.image img{width:100%;border-radius:12px;display:block}
.message.file{
  background:var(--bg3);cursor:pointer;border:1px solid var(--accent);
  display:flex;align-items:center;gap:8px;
}
.message.file:hover{background:var(--accent);color:#fff}
.typing{
  align-self:flex-start;background:var(--assistant-bubble);padding:12px 18px;
  border-radius:18px;border-bottom-left-radius:6px;display:flex;gap:4px;
}
.typing span{width:8px;height:8px;background:var(--text2);border-radius:50%;animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{opacity:0.3}30%{opacity:1}}
/* ─── Input ─────────────────────────────────────────────── */
.input-area{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);flex-shrink:0;
}
.input-area .input-wrap{
  flex:1;display:flex;align-items:center;gap:4px;
  background:var(--bg2);border-radius:24px;padding:4px 8px;
  border:1px solid #333;
}
.input-area .input-wrap:focus-within{border-color:var(--accent)}
.input-area input{
  flex:1;background:none;border:none;color:var(--text);font-size:15px;
  padding:8px 4px;outline:none;
}
.input-area input::placeholder{color:var(--text2)}
.input-btn{
  background:none;border:none;color:var(--text2);font-size:20px;
  cursor:pointer;padding:6px;border-radius:50%;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
}
.input-btn:hover{background:var(--bg3);color:var(--accent)}
.input-btn.send{color:var(--accent);background:var(--bg3)}
.input-btn.send:hover{background:var(--accent);color:#fff}
/* ─── Status Bar ─────────────────────────────────────────── */
.status-bar{
  display:flex;align-items:center;gap:8px;padding:4px 12px;
  padding-bottom:calc(4px + env(safe-area-inset-bottom));
  background:var(--bg2);font-size:12px;color:var(--text2);
  flex-shrink:0;border-top:1px solid #333;
}
.status-bar .model-info{margin-left:auto}
/* ─── Settings Panel ─────────────────────────────────────── */
.settings-panel{
  display:none;flex-direction:column;flex:1;overflow:hidden;
}
.settings-panel.active{display:flex}
.settings-header{padding:12px 16px;font-size:18px;font-weight:bold;color:var(--accent);flex-shrink:0}
.settings-tabs{
  display:flex;overflow-x:auto;gap:0;flex-shrink:0;
  border-bottom:1px solid #333;
}
.settings-tab{
  padding:10px 16px;font-size:13px;cursor:pointer;white-space:nowrap;
  color:var(--text2);border-bottom:2px solid transparent;transition:all 0.2s;
  flex-shrink:0;
}
.settings-tab:hover{color:var(--text);background:var(--bg3)}
.settings-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.settings-body{
  flex:1;overflow-y:auto;padding:12px 16px;
}
/* ─── Sessions Panel ─────────────────────────────────────── */
.sessions-panel{
  display:none;flex-direction:column;flex:1;overflow:hidden;
}
.sessions-panel.active{display:flex}
.sessions-header{padding:12px 16px;font-size:16px;font-weight:bold;color:var(--accent);flex-shrink:0}
.sessions-list{flex:1;overflow-y:auto;padding:8px 12px}
.session-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-radius:var(--radius-sm);cursor:pointer;
  transition:all 0.2s;border-bottom:1px solid #333;
}
.session-item:hover{background:var(--bg3)}
.session-item .icon{font-size:18px;flex-shrink:0}
.session-item .info{flex:1;min-width:0}
.session-item .title{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item .date{font-size:11px;color:var(--text2)}
.session-item .del-btn{
  background:none;border:none;color:var(--danger);font-size:16px;
  cursor:pointer;padding:4px;border-radius:4px;display:none;
}
.session-item:hover .del-btn{display:block}
.session-item .del-btn:hover{background:var(--danger);color:#fff}
/* ─── Session Detail ─────────────────────────────────────── */
.session-detail{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg);flex-direction:column;
}
.session-detail.active{display:flex}
.session-detail-header{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--bg2);flex-shrink:0;
}
.session-detail-header .back-btn{
  background:none;border:none;color:var(--accent);font-size:14px;
  cursor:pointer;padding:6px 10px;
}
.session-detail-header .title{
  flex:1;font-size:15px;font-weight:bold;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.session-detail-body{
  flex:1;overflow-y:auto;padding:12px;
  display:flex;flex-direction:column;gap:8px;
}
.session-detail-body .msg{
  padding:8px 12px;border-radius:12px;font-size:14px;
  line-height:1.5;max-width:85%;word-wrap:break-word;white-space:pre-wrap;
}
.session-detail-body .msg.user{
  align-self:flex-end;background:var(--user-bubble);color:#fff;
  border-bottom-right-radius:4px;
}
.session-detail-body .msg.assistant{
  align-self:flex-start;background:var(--assistant-bubble);color:var(--text);
  border-bottom-left-radius:4px;
}
.session-detail-empty{
  display:flex;align-items:center;justify-content:center;flex:1;
  color:var(--text2);font-size:14px;
}
.settings-section{display:none}
.settings-section.active{display:block}
.settings-section h3{font-size:15px;margin:8px 0;color:var(--accent)}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:3px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--bg3);border:1px solid #444;color:var(--text);
  font-size:14px;outline:none;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group .switch{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:6px 0;
}
.form-group .switch input[type="checkbox"]{
  width:0;height:0;opacity:0;position:absolute;
}
.form-group .switch .slider{
  width:44px;height:24px;background:#555;border-radius:12px;position:relative;
  transition:0.3s;flex-shrink:0;
}
.form-group .switch .slider::after{
  content:'';position:absolute;width:20px;height:20px;border-radius:50%;
  background:white;top:2px;left:2px;transition:0.3s;
}
.form-group .switch input:checked + .slider{background:var(--accent)}
.form-group .switch input:checked + .slider::after{left:22px}
.form-group .switch .label-text{font-size:14px}
.form-group .grid-2{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.btn{
  padding:8px 16px;border:none;border-radius:var(--radius-sm);
  font-size:14px;cursor:pointer;transition:all 0.2s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
/* ─── Toast / Notification ──────────────────────────────── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--bg3);color:var(--text);padding:10px 20px;
  border-radius:var(--radius);border:1px solid var(--accent);
  font-size:14px;z-index:100;display:none;animation:toastIn 0.3s;
  max-width:90vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* ─── Responsive ─────────────────────────────────────────── */
/* ─── Sessions Panel ─────────────────────────────────────── */
.sessions-panel{
  display:none;flex-direction:column;flex:1;overflow:hidden;
}
.sessions-panel.active{display:flex}
.sessions-header{padding:12px 16px;font-size:18px;font-weight:bold;color:var(--accent);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sessions-header .close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;margin-left:auto;padding:4px 8px;border-radius:var(--radius-sm)}
.sessions-header .close:hover{background:var(--bg3);color:var(--text)}
.sessions-list{flex:1;overflow-y:auto;padding:8px 12px}
.session-card{
  background:var(--bg3);border-radius:var(--radius);padding:12px;margin-bottom:8px;
  cursor:pointer;transition:all 0.2s;border:1px solid transparent;
}
.session-card:hover{background:var(--bg2);border-color:var(--accent)}
.session-card .s-title{font-size:14px;color:var(--text);font-weight:bold;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-card .s-meta{font-size:11px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap}
.session-card .s-meta span{display:flex;align-items:center;gap:3px}
.session-card .s-preview{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── Session Detail (messages) ──────────────────────────── */
.session-detail{
  display:none;flex-direction:column;flex:1;overflow:hidden;position:absolute;inset:0;z-index:20;
  background:var(--bg);
}
.session-detail.active{display:flex}
.session-detail-header{
  display:flex;align-items:center;padding:10px 12px;background:var(--bg2);
  border-bottom:1px solid #333;flex-shrink:0;gap:8px;
}
.session-detail-header .back-btn{background:none;border:none;color:var(--accent);font-size:18px;cursor:pointer;padding:4px 8px}
.session-detail-header .s-title{font-size:16px;font-weight:bold;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-detail-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.session-detail-body .message{max-width:95%;font-size:13px;padding:8px 12px;border-radius:14px}
.session-detail-body .message.assistant{border:1px solid #333}

@media(max-width:480px){
  .message{max-width:90%;font-size:14px}
  .settings-tab{padding:8px 10px;font-size:12px}
  .session-detail{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30}
}
/* ─── File/Camera hidden inputs ─────────────────────────── */
.hidden-input{display:none}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <button class="btn active" id="btnChat" onclick="showChat()">💬</button>
  <span class="title">Hermonoid</span>
  <button class="btn" id="btnSessions" onclick="showSessions()">📋</button>
  <button class="btn" id="btnSettings" onclick="showSettings()">⚙️</button>
  <button class="btn" onclick="toggleTheme()">🌓</button>
</div>

<!-- Chat Area -->
<div class="chat-area" id="chatArea"></div>

<!-- Settings Panel -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">⚙️ Налаштування Hermes</div>
  <div class="settings-tabs" id="settingsTabs"></div>
  <div class="settings-body" id="settingsBody"></div>
</div>

<!-- Sessions Panel -->
<div class="sessions-panel" id="sessionsPanel">
  <div class="sessions-header">
    📋 Попередні сесії
    <button class="close" onclick="showChat()">✕</button>
  </div>
  <div class="sessions-list" id="sessionsList"></div>
</div>

<!-- Session Detail (overlay) -->
<div class="session-detail" id="sessionDetail">
  <div class="session-detail-header">
    <button class="back-btn" onclick="closeSessionDetail()">← Назад</button>
    <span class="s-title" id="detailTitle">Сесія</span>
  </div>
  <div class="session-detail-body" id="detailMessages"></div>
</div>

<!-- Input Area -->
<div class="input-area" id="inputArea">
  <div class="input-wrap">
    <button class="input-btn" onclick="pickFile()" title="Файл">📎</button>
    <button class="input-btn" onclick="pickCamera()" title="Камера">📷</button>
    <input type="text" id="msgInput" placeholder="Напишіть повідомлення..." 
           onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage()}">
    <button class="input-btn send" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- Status Bar -->
<div class="status-bar">
  <span id="statusText"></span>
  <span class="model-info" id="modelInfo"></span>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="fileInput" class="hidden-input" onchange="handleFilePick(event)">
<input type="file" id="cameraInput" class="hidden-input" accept="image/*" capture="environment" onchange="handleCameraPick(event)">

<script>
// ─── State ─────────────────────────────────────────────────
let messages = [];
let isDark = true;
let currentConfig = {};
let currentEnv = {};

// ─── DOM Refs ──────────────────────────────────────────────
const chatArea = document.getElementById('chatArea');
const settingsPanel = document.getElementById('settingsPanel');
const settingsTabs = document.getElementById('settingsTabs');
const settingsBody = document.getElementById('settingsBody');
const msgInput = document.getElementById('msgInput');
const statusText = document.getElementById('statusText');
const modelInfo = document.getElementById('modelInfo');
const toastEl = document.getElementById('toast');

// ─── Toast ─────────────────────────────────────────────────
function showToast(msg, isError=false) {
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  toastEl.style.borderColor = isError ? 'var(--danger)' : 'var(--accent)';
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
}

// ─── Chat ──────────────────────────────────────────────────
function addMessage(role, content, type='text') {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  
  if (type === 'image' && role === 'assistant') {
    div.classList.add('image');
    const img = document.createElement('img');
    img.src = content.startsWith('http') ? content : `data:image/png;base64,${content}`;
    img.loading = 'lazy';
    div.appendChild(img);
  } else if (type === 'file' && role === 'assistant') {
    div.classList.add('file');
    div.innerHTML = '📄 ' + content;
    div.onclick = () => downloadFile(content);
  } else {
    div.textContent = content;
  }
  
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  
  msgInput.value = '';
  addMessage('user', text);
  messages.push({role: 'user', content: text, type: 'text'});
  
  showTyping();
  statusText.textContent = '🤔 Hermes думає...';
  
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    
    hideTyping();
    statusText.textContent = '';
    
    if (data.response) {
      // Check for images/files in response
      const resp = data.response;
      const imgMatch = resp.match(/https?:\/\/[^\s]+\.(png|jpg|jpeg|gif|webp)/i);
      const fileMatch = resp.match(/(?:Файл|FILE):\s*(.+)/);
      
      if (imgMatch) {
        addMessage('assistant', imgMatch[1], 'image');
      } else if (fileMatch) {
        addMessage('assistant', fileMatch[1], 'file');
      } else {
        addMessage('assistant', resp);
      }
      messages.push({role: 'assistant', content: data.response, type: 'text'});
    }
  } catch (e) {
    hideTyping();
    addMessage('assistant', '❌ Помилка з\'єднання: ' + e.message);
    statusText.textContent = '❌ Помилка';
  }
  
  // Update status
  updateStatus();
}

// ─── File/Camera ───────────────────────────────────────────
function pickFile() {
  document.getElementById('fileInput').click();
}

function pickCamera() {
  document.getElementById('cameraInput').click();
}

async function handleFilePick(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  addMessage('user', `📎 Файл: ${file.name}`);
  
  // Read and upload
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const b64 = ev.target.result.split(',')[1];
    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({filename: file.name, content: b64, type: file.type.startsWith('text') ? 'text' : 'binary'})
      });
      const data = await res.json();
      
      // Auto-send to Hermes with file context
      if (data.preview) {
        msgInput.value = `Я надіслав файл: ${file.name}. Ось його вміст:\n${data.preview.substring(0,1500)}\n\n[файл ${file.name} завантажено, ${data.size} байт]`;
      } else {
        msgInput.value = `Я надіслав файл: ${file.name} (${data.size} байт).`;
      }
      // Don't auto-send - let user press Enter
      showToast('✅ Файл завантажено');
    } catch(e) {
      showToast('❌ Помилка: ' + e.message, true);
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

async function handleCameraPick(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  addMessage('user', '📷 Фото з камери');
  
  // Show preview
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const b64 = ev.target.result.split(',')[1];
    
    // Display in chat
    const preview = document.createElement('div');
    preview.className = 'message user image';
    preview.innerHTML = `<img src="data:image/jpeg;base64,${b64}" style="max-width:250px;border-radius:12px">`;
    chatArea.appendChild(preview);
    chatArea.scrollTop = chatArea.scrollHeight;
    
    // Upload and auto-send
    try {
      await fetch('/api/upload', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({filename: 'camera_photo.jpg', content: b64, type: 'image'})
      });
      
      msgInput.value = `Я надіслав фото з камери. Опиши що на ньому. [base64:${b64.substring(0,50)}...]`;
      showToast('✅ Фото завантажено');
    } catch(e) {
      showToast('❌ Помилка: ' + e.message, true);
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function downloadFile(content) {
  // Simple download via blob
  const blob = new Blob([content], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hermes_output.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─── Views ─────────────────────────────────────────────────
function showChat() {
  document.getElementById('chatArea').classList.remove('hidden');
  settingsPanel.classList.remove('active');

function loadSessions() {
  const list = document.getElementById('sessionsList');
  list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">⏳ Завантаження...</div>';
  fetch('/api/sessions?limit=50')
    .then(r => r.json())
    .then(sessions => {
      if (!sessions.length || sessions.error) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">Немає попередніх сесій</div>';
        return;
      }
      list.innerHTML = sessions.map(s => {
        const title = s.title || 'Без назви';
        const time = formatSessionTime(s.started_at);
        const msgs = s.message_count || '?';
        const tokens = (s.input_tokens || 0) + (s.output_tokens || 0);
        const preview = s.first_user_msg ? escapeHtml(s.first_user_msg.substring(0, 120)) : '';
        return `<div class="session-card" onclick="openSessionDetail('${s.id}')">
          <div class="s-title">${escapeHtml(title)}</div>
          ${preview ? `<div class="s-preview">${preview}</div>` : ''}
          <div class="s-meta">
            <span>🕐 ${time}</span>
            <span>💬 ${msgs}</span>
            <span>🔤 ${tokens.toLocaleString()}</span>
            <span>📌 ${s.source || 'cli'}</span>
          </div>
        </div>`;
      }).join('');
    })
    .catch(e => {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger)">❌ Помилка: ' + e.message + '</div>';
    });
}

function openSessionDetail(sessionId) {
  document.getElementById('sessionDetail').classList.add('active');
  document.getElementById('detailTitle').textContent = 'Завантаження...';
  const body = document.getElementById('detailMessages');
  body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">⏳ Завантаження повідомлень...</div>';

  // Get title from session list
  fetch('/api/sessions?limit=1')
    .then(r => r.json())
    .then(sessions => {
      const s = sessions.find(x => x.id === sessionId);
      if (s && s.title) document.getElementById('detailTitle').textContent = s.title;
    })
    .catch(() => {});

  fetch('/api/sessions/' + sessionId + '/messages?limit=200')
    .then(r => r.json())
    .then(msgs => {
      if (!msgs.length || msgs.error) {
        body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">Немає повідомлень</div>';
        return;
      }
      body.innerHTML = msgs.map(m => {
        const role = m.role === 'user' ? 'user' : 'assistant';
        const content = truncateContent(m.content || '');
        return `<div class="message ${role}">${escapeHtml(content)}</div>`;
      }).join('');
      body.scrollTop = body.scrollHeight;
    })
    .catch(e => {
      body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger)">❌ Помилка: ' + e.message + '</div>';
    });
}

function closeSessionDetail() {
  document.getElementById('sessionDetail').classList.remove('active');
}

function formatSessionTime(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'щойно';
  if (diff < 3600000) return Math.floor(diff/60000) + ' хв тому';
  if (diff < 86400000) return Math.floor(diff/3600000) + ' год тому';
  if (diff < 604800000) return Math.floor(diff/86400000) + ' дн тому';
  return d.toLocaleDateString('uk-UA', {day:'numeric', month:'short', year:'numeric'});
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncateContent(s) {
  if (!s) return '';
  return s.length > 500 ? s.substring(0, 500) + '…' : s;
}

async function viewSession(id) {
  // Show detail with loading
  document.getElementById('sessionDetail').classList.add('active');
  document.getElementById('sessionDetailTitle').textContent = 'Завантаження...';
  document.getElementById('sessionDetailBody').innerHTML = '<div class="session-detail-empty">Завантаження...</div>';
  
  try {
    // Get session messages from Hermes via --resume
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: `/history session:${id}`, context_id: id})
    });
    // Fallback: just resume and get title
    const detail = document.getElementById('sessionDetailBody');
    document.getElementById('sessionDetailTitle').textContent = `Сесія: ${id.substring(0,12)}...`;
    detail.innerHTML = `
      <div style="text-align:center;padding:20px;color:var(--text2)">
        📋 Сесія <strong>${id}</strong><br><br>
        <button class="btn btn-primary" onclick="resumeSession('${id}')">▶️ Продовжити в чаті</button>
        <button class="btn btn-outline" onclick="closeSessionDetail()" style="margin-left:8px">← Назад</button>
      </div>
    `;
  } catch(e) {
    document.getElementById('sessionDetailBody').innerHTML = 
      '<div class="session-detail-empty" style="color:var(--danger)">❌ Помилка: ' + e.message + '</div>';
  }
}

function resumeSession(id) {
  showChat();
  msgInput.value = `/resume ${id}`;
  sendMessage();
}

function closeSessionDetail() {
  document.getElementById('sessionDetail').classList.remove('active');
}

async function deleteSession(id) {
  if (!confirm('Видалити сесію ' + id.substring(0,12) + '...?')) return;
  
  try {
    const res = await fetch(`/api/sessions/${id}`, {method: 'DELETE'});
    const data = await res.json();
    showToast(data.status || '✅ Видалено');
    loadSessions(); // Refresh list
  } catch(e) {
    showToast('❌ ' + e.message, true);
  }
}

// ─── Safe Area / Viewport Fix ──────────────────────────────
// When the virtual keyboard opens/closes or address bar hides on mobile,
// ensure the input area stays visible above the nav bar
function applySafeArea() {
  // If visualViewport is available, use it to adjust
  if (window.visualViewport) {
    const diff = window.innerHeight - window.visualViewport.height;
    if (diff > 100) {
      // Keyboard is open — no extra safe area needed, keyboard pushes content
      document.documentElement.style.setProperty('--safe-bottom', '0px');
    } else {
      // Keyboard closed — apply safe area from CSS env()
      document.documentElement.style.setProperty('--safe-bottom', 'env(safe-area-inset-bottom, 0px)');
    }
  }
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', applySafeArea);
  window.visualViewport.addEventListener('scroll', applySafeArea);
}
applySafeArea();

// Ensure input stays in view when focused on mobile
msgInput.addEventListener('focus', () => {
  // Small delay to let keyboard open
  setTimeout(() => msgInput.scrollIntoView({block: 'center', behavior: 'smooth'}), 300);
});

function deepGet(obj, path, def=null) {
  const keys = path.split('.');
  let val = obj;
  for (const k of keys) {
    if (val && typeof val === 'object') val = val[k];
    else return def;
  }
  return val !== undefined && val !== null ? val : def;
}

function saveConfigField(section, key, value) {
  currentConfig[section] = currentConfig[section] || {};
  currentConfig[section][key] = value;
  saveFullConfig();
}

function saveFullConfig() {
  fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(currentConfig)
  }).then(r=>r.json()).then(data => {
    showToast(data.status || '✅ Збережено');
  }).catch(e => showToast('❌ Помилка: '+e.message, true));
}

  setNested(currentConfig, 'sessions.auto_prune', document.getElementById('cfg-sessions-auto_prune').checked);
  setNested(currentConfig, 'sessions.retention_days', parseInt(document.getElementById('cfg-sessions-retention_days').value));
  saveFullConfig();
}

function saveEnvConfig() {
  fetch('/api/env/keys').then(r=>r.json()).then(keys => {
    const env = {};
    for (const {key} of keys) {
      const val = document.getElementById('env-'+key).value.trim();
      if (val) env[key] = val;
    }
    fetch('/api/env', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(env)
    }).then(r=>r.json()).then(data => {
      showToast(data.status || '✅ Збережено');
      currentEnv = env;
    });
  });
}

function createProfile() {
  const name = document.getElementById('newProfileName').value.trim();
  if (!name) { showToast('❌ Введіть назву', true); return; }
  fetch('/api/profiles', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  }).then(r=>r.json()).then(data => {
    showToast(data.status || '✅ Створено');
    buildProfilesSection();
  });
}

function deleteProfile() {
  const name = document.getElementById('profileSelect').value;
  if (name === 'default') { showToast('❌ Не можна видалити default', true); return; }
  fetch('/api/profiles/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  }).then(r=>r.json()).then(data => {
    showToast(data.status || '✅ Видалено');
    buildProfilesSection();
  });
}

// ─── Helpers ───────────────────────────────────────────────
function setNested(obj, path, value) {
  const keys = path.split('.');
  let d = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (!d[keys[i]] || typeof d[keys[i]] !== 'object') d[keys[i]] = {};
    d = d[keys[i]];
  }
  d[keys[keys.length - 1]] = value;
}

// ─── Load Settings ─────────────────────────────────────────
async function loadSettings() {
  try {
    const [cfgRes, envRes] = await Promise.all([
      fetch('/api/config'),
      fetch('/api/env')
    ]);
    currentConfig = await cfgRes.json();
    currentEnv = await envRes.json();
    buildSettingsUI();
  } catch(e) {
    showToast('❌ Помилка завантаження налаштувань: ' + e.message, true);
  }
}

function formatSessionDate(ts) {
  if (!ts) return '';
  const n = Number(ts);
  if (!isNaN(n) && n > 1000000000) {
    const d = new Date(n * 1000);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'щойно';
    if (diff < 3600) return Math.floor(diff/60) + 'м тому';
    if (diff < 86400) return Math.floor(diff/3600) + 'год тому';
    if (diff < 604800) return Math.floor(diff/86400) + 'д тому';
    return d.toLocaleDateString('uk-UA', {day:'numeric',month:'short',year:'numeric'});
  }
  return ts;
}
